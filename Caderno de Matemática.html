<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Caderno de Matemática</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: caderno escolar — faixa de cabeçalho na cor do ano, abas de ano, trilha de 10 fichas e a ficha atual como folha de papel.
   Tema único e claro por escolha (papel de caderno), com todas as cores definidas aqui. */
:root{
  --paper:#ffffff; --desk:#eef2f0; --ink:#2b2b3a; --muted:#5d6678; --line:#d5dbe3;
  --ok:#1f9a5a; --ok-bg:#e3f7ec; --no:#d6455f; --no-bg:#fde8ec; --star:#f5b301;
  --c:#2E9E6B; --l:#E4F6EC; --d:#1f6f4b;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
body.g4{--c:#F07E26;--l:#FFF0E2;--d:#b5560f}
body.g5{--c:#3D6FD1;--l:#E7EEFF;--d:#284a93}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--c)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabeçalho */
.top{background:var(--c);color:#fff;transition:background .3s}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .mascot{width:54px;height:60px;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);margin:0;line-height:1.05;text-wrap:balance}
.brand p{margin:2px 0 0;font-weight:700;font-size:13px;opacity:.92}
.score{display:flex;align-items:center;gap:8px;background:#ffffff26;border-radius:999px;padding:6px 14px 6px 8px;font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score svg{width:26px;height:26px}
.tabs{display:flex;gap:6px;margin-top:12px;width:100%}
.tab{flex:1;max-width:190px;border:0;background:#ffffff33;color:#fff;font-family:var(--display);font-weight:600;font-size:18px;padding:10px 12px 8px;border-radius:14px 14px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tab small{font-family:var(--body);font-weight:800;font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--desk);color:var(--d)}
.tab[data-g="3"]{box-shadow:inset 0 4px #2E9E6B}.tab[data-g="4"]{box-shadow:inset 0 4px #F07E26}.tab[data-g="5"]{box-shadow:inset 0 4px #3D6FD1}

/* trilha de fichas */
.trail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-block:16px 4px}
.tchip{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 8px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;min-width:0}
.tchip b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--l);color:var(--d);font-family:var(--display);display:flex;align-items:center;justify-content:center;font-size:14px}
.tchip span{font-size:12.5px;font-weight:700;line-height:1.2;min-width:0}
.tchip em{font-style:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
svg.ill text{font-family:var(--display)}
.tchip i{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.tchip.cur{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
.tchip.done b{background:var(--c);color:#fff}
@media (max-width:640px){.trail{grid-template-columns:repeat(2,1fr)}}

/* ficha */
.sheet{background:var(--paper);border-radius:22px;margin-block:12px 28px;padding:18px clamp(14px,3vw,26px) 22px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px #2b2b3a55;border:2.5px solid var(--c)}
.shead{display:flex;align-items:center;gap:14px;background:var(--l);border-radius:16px;padding:10px 12px 10px 18px;flex-wrap:wrap}
.shead .tt{flex:1;min-width:220px}
.shead small{font-family:var(--display);font-weight:600;color:var(--d);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.shead h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,30px);color:var(--d);margin:0;line-height:1.1;text-wrap:balance}
.shead p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:13.5px}
.tipbox{display:flex;align-items:center;gap:6px;max-width:330px}
.bubble{background:var(--paper);border:2px solid var(--c);border-radius:14px;padding:7px 11px;font-size:13px;line-height:1.35;position:relative}
.bubble::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--c)}
.tipbox .mascot{width:76px;height:76px;flex:none}
.bubble.party{background:var(--ok-bg);border-color:var(--ok)}
.bubble.party::after{border-left-color:var(--ok)}

.qs{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.q{border:2px dashed var(--line);border-radius:16px;padding:14px 16px 12px;display:grid;grid-template-columns:36px 1fr;gap:4px 12px;transition:border-color .2s,background .2s}
.q.ok{border-style:solid;border-color:var(--ok);background:linear-gradient(var(--ok-bg),var(--paper) 70px)}
.num{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--d)}
.q.ok .num{background:var(--ok);box-shadow:0 2px 0 #12663a}
.qb{min-width:0;font-size:16px}
.qb>*+*{margin-top:8px}
.qb svg.ill{max-width:100%;height:auto;display:block}
.qfoot{grid-column:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:12px;padding:9px 18px;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;background:var(--c);color:#fff;box-shadow:0 3px 0 var(--d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--d)}
.btn.ghost{background:var(--paper);color:var(--d);border:2px solid var(--c);box-shadow:none;padding:7px 14px}
.btn.small{font-size:14px;padding:6px 12px}
.qb .small{font-size:13px;color:var(--muted);font-weight:700}
.fb{font-weight:800;font-size:14.5px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.gab{background:#fff8d6;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700}
.q.ok .chk{display:none}

/* elementos das questões */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 22px}
.grid>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ql{display:flex;flex-direction:column;gap:8px;min-width:0}
.ql>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.big{font-family:var(--display);font-size:20px}
.ex{display:inline-block;background:var(--l);border-radius:8px;padding:2px 10px;font-size:14px;color:var(--d);font-weight:800}
.note{background:#fff8d6;border-left:4px solid var(--star);border-radius:6px;padding:6px 10px;font-size:14px;max-width:340px}
.chip{display:inline-block;background:var(--l);border:2px solid var(--c);border-radius:20px;padding:1px 12px;font-family:var(--display);font-size:17px}
.card{display:inline-flex;width:40px;height:48px;align-items:center;justify-content:center;background:var(--paper);border:2.5px solid var(--c);border-radius:8px;font-family:var(--display);font-size:24px;box-shadow:2px 2px 0 var(--c)}
.in,.sel{border:2px dashed #8a93a6;border-radius:9px;background:#fbfcfe;padding:4px 8px;font-family:var(--display);font-size:18px;text-align:center;max-width:100%;min-height:38px;vertical-align:middle;transition:border-color .15s,background .15s}
.in[data-t="t"]{text-align:left;font-family:var(--body);font-size:16px}
.sel{text-align:left;font-family:var(--body);font-size:16px;cursor:pointer}
.in:focus,.sel:focus{border-style:solid;border-color:var(--c);background:var(--paper);outline:none}
.in.ok,.sel.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.in.no,.sel.no{border-style:solid;border-color:var(--no);background:var(--no-bg)}
.choice{display:inline-flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 14px;font-weight:800;cursor:pointer;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--c);background:var(--l);color:var(--d)}
.choice.ok .opt[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.choice.no .opt[aria-pressed="true"]{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--display);font-size:18px;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid var(--ink);padding:0 3px}
.fr .in{width:42px!important;min-height:30px;padding:1px 4px;font-size:16px;margin:2px 0}
.ord,.tab{border-collapse:collapse;font-family:var(--display)}
.ord th{background:var(--c);color:#fff;font-size:12px;padding:3px 10px;border:1.6px solid var(--d);font-weight:600}
.ord td{border:1.6px solid var(--d);text-align:center;font-size:19px;padding:2px 12px}
.tw{overflow-x:auto;max-width:100%}
.tab{font-family:var(--body);font-size:15px}
.tab th{background:var(--c);color:#fff;padding:5px 12px;border:1.6px solid var(--d);font-weight:800;text-align:left}
.tab td{border:1.6px solid var(--d);padding:4px 10px;text-align:center;min-width:56px}
.tab td .in{min-height:32px;font-size:16px}
.tab tr.tot td{background:var(--l);font-weight:800}
.arm{display:inline-flex;flex-direction:column;align-items:flex-end;font-family:var(--display);font-size:23px;letter-spacing:4px;line-height:1.2;padding-left:28px}
.arm .r{white-space:pre;position:relative}
.arm .op{position:absolute;left:-26px;color:var(--c);font-weight:700}
.arm .bar{border-top:2.5px solid var(--ink);width:100%;margin:2px 0 6px}
.arm .in{letter-spacing:2px;text-align:right}
.chave{display:inline-flex;flex-direction:column;gap:6px;font-family:var(--display);font-size:22px}
.chave .cg{display:inline-grid;grid-template-columns:auto auto}
.chave .dvd{padding:2px 8px 2px 4px;border-right:2.5px solid var(--ink)}
.chave .dvs{padding:2px 8px;border-bottom:2.5px solid var(--ink);min-width:56px}
.chave label{font-family:var(--body);font-size:14px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.menu{background:#2f4a3d;color:#fff;border-radius:10px;padding:6px 12px;border:4px solid #c98b4b;font-size:15px;min-width:190px}
.menu .mh{text-align:center;font-family:var(--display);font-size:12px;letter-spacing:1px;color:#ffcf33}
.menu .mi{display:flex;justify-content:space-between;gap:10px}
.cal{border-collapse:collapse;font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.cal th,.cal td{border:1px solid var(--line);width:28px;height:22px}
.cal tr.ch th{background:var(--c);color:#fff;font-family:var(--display);height:24px;font-weight:600}
.cal th{background:var(--l)}
.cal td.we{color:var(--no);font-weight:800}
.cc{display:flex;flex-direction:column;align-items:center;gap:6px}

/* dinheiro */
.money{display:flex;flex-direction:column;gap:10px}
.mpal{display:flex;flex-wrap:wrap;gap:8px}
.mi-btn{border:0;cursor:pointer;font-family:var(--display);font-weight:700;color:#fff;padding:0;background:none}
.bill{display:inline-flex;align-items:flex-end;justify-content:flex-end;width:84px;height:42px;border-radius:6px;padding:3px 8px;font-size:20px;box-shadow:inset 0 0 0 3px #ffffff66,0 2px 0 #00000026;line-height:1}
.bill small{font-size:9px;margin-left:3px;font-family:var(--body);font-weight:800}
.coinb{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#f2c94c;border:3px solid #c99a1a;color:#5a4a1a;font-size:13px}
.coinb.sv{background:#d9dde6;border-color:#9aa1ad}
.tray{min-height:62px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tray:empty::before{content:"A bandeja está vazia";color:var(--muted);font-size:14px;font-weight:700}
.mtotal{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.money.ok .tray{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.money.no .tray{border-style:solid;border-color:var(--no);background:var(--no-bg)}

/* simetria */
.sym{display:inline-grid;gap:2px;position:relative;padding:4px;background:var(--line);border-radius:6px}
.sym button{width:30px;height:30px;border:0;background:var(--paper);cursor:pointer;padding:0;border-radius:2px}
.sym button.on{background:#a77bd1}
.sym button.fix{cursor:default}
.sym .axis{position:absolute;top:0;bottom:0;width:0;border-left:3px dashed var(--no)}
.sym.ok{background:var(--ok)}.sym.no{background:var(--no)}

/* resultados */
.tab.res{max-width:220px}
.tab.res[aria-selected="true"]{color:var(--ink)}
.tab[data-g="res"]{box-shadow:inset 0 4px #ffd34d}
.res-view{margin-block:16px 28px;display:flex;flex-direction:column;gap:16px}
.rhead{background:var(--paper);border-radius:22px;border:2.5px solid var(--c);padding:18px clamp(14px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.rtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rtop small{font-family:var(--display);font-weight:600;color:var(--d);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.rtop h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,30px);color:var(--d);margin:0;line-height:1.1}
.rtop p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:13.5px;max-width:52ch}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--desk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--d);box-shadow:0 1px 3px #2b2b3a33}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{border-radius:14px;padding:10px 12px;background:var(--desk)}
.kpi b{display:block;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;font-weight:800;color:var(--muted)}
.kpi.k-ok{background:var(--ok-bg)}.kpi.k-ok b{color:var(--ok)}
.kpi.k-no{background:var(--no-bg)}.kpi.k-no b{color:var(--no)}
.kpi.k-nc{background:#fff4d6}.kpi.k-nc b{color:#a87400}
.kpi.k-main{background:var(--l)}.kpi.k-main b{color:var(--d)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi.k-main{grid-column:1/-1}}
.meter{height:12px;border-radius:999px;background:var(--desk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;font-weight:800;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--dot);vertical-align:-1px}
.rtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rcard{background:var(--paper);border-radius:18px;border:2px solid var(--line);overflow:hidden}
.rcard>header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--l);flex-wrap:wrap}
.rcard>header b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-size:15px;display:flex;align-items:center;justify-content:center}
.rcard>header h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:var(--d);flex:1;min-width:160px}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--dot)}
.rcard>header .cnt{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;color:var(--d)}
.rtw{overflow-x:auto}
.rt{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.rt th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 12px;border-bottom:2px solid var(--line)}
.rt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rt tr:last-child td{border-bottom:0}
.rt td.qn{font-family:var(--display);font-weight:600;font-size:16px;width:40px;color:var(--d)}
.rt td.qt{max-width:300px;color:var(--ink)}
.rt td.ans{font-family:var(--display);font-size:15.5px}
.rt td.ans.empty{color:var(--muted);font-family:var(--body)}
.rt td.right{color:var(--ok);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:800;white-space:nowrap;background:var(--bgp);color:var(--fgp)}
.st-ok{--dot:var(--ok);--bgp:var(--ok-bg);--fgp:var(--ok)}
.st-no{--dot:var(--no);--bgp:var(--no-bg);--fgp:var(--no)}
.st-nc{--dot:#e2a400;--bgp:#fff4d6;--fgp:#8a6100}
.st-em{--dot:#c8ced8;--bgp:var(--desk);--fgp:var(--muted)}
.tries{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.go{background:none;border:0;color:var(--d);font-weight:800;text-decoration:underline;cursor:pointer;font-size:13px;padding:0;white-space:nowrap}
.copied{font-size:13px;font-weight:800;color:var(--ok)}
.copybox{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Menlo,monospace;border:2px solid var(--line);border-radius:10px;padding:8px}

/* zerar */
.hact{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:600px){.brand{flex-basis:100%}.hact{width:100%;justify-content:space-between}}
.zbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid #ffffffb3;background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.zbtn svg{width:18px;height:18px}
.zbtn:hover{background:#ffffff26}
.zov{position:fixed;inset:0;z-index:50;background:#1d2130b3;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zbox{background:var(--paper);border-radius:20px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px -20px #000}
.zbox h3{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 4px;color:var(--ink)}
.zbox p{margin:0 0 14px;color:var(--muted);font-weight:700;font-size:14.5px}
.zopts{display:flex;flex-direction:column;gap:10px}
.zopt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 14px;cursor:pointer}
.zopt b{font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink)}
.zopt span{font-size:13px;font-weight:700;color:var(--muted)}
.zopt:hover{border-color:var(--no);background:var(--no-bg)}
.zopt.all b{color:var(--no)}
.zfoot{display:flex;justify-content:flex-end;margin-top:14px}
.zdone{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;z-index:60}

.sfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:2px dashed var(--line)}
.sfoot .bncc{font-size:12px;font-weight:800;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.reset{padding-block:0 30px;display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-weight:700;font-size:14px}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}*{transition:none!important}}
@media (max-width:520px){.tipbox{max-width:none;width:100%}.tipbox .mascot{width:60px;height:60px}.q{grid-template-columns:30px 1fr;padding:12px 12px 10px}.num{width:30px;height:30px;font-size:15px}.arm{font-size:20px}.sym button{width:24px;height:24px}}

const KEY = "caderno-mat-v1";

/* ---------- normalização das respostas ---------- */
const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function num(s){
  s = String(s).toLowerCase().replace(/r\$|\s|°c|º/g, "");
  if (!/^-?[\d.,]+$/.test(s)) return NaN;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  return parseFloat(s);
}
function time(s){
  s = strip(s).replace(/\s|min(utos)?/g, "").replace(/h(oras?)?/, ":");
  if (/^\d{1,2}$/.test(s)) s += ":00";
  if (s.endsWith(":")) s += "00";
  const m = s.match(/^(\d{1,2}):(\d{1,2})$/); if (!m) return s;
  return (+m[1]) + ":" + m[2].padStart(2, "0");
}
function same(v, a, t){
  const alts = a.split("|");
  if (t === "n") { const x = num(v); return !isNaN(x) && alts.some(z => Math.abs(num(z) - x) < 1e-9); }
  if (t === "h") return alts.some(z => time(z) === time(v));
  if (t === "c") return alts.some(z => z.replace(/\s/g,"").toUpperCase() === v.replace(/\s/g,"").toUpperCase());
  if (t === "f") return alts.some(z => z.replace(/\s/g,"") === v.replace(/\s/g,""));
  const k = x => strip(x).replace(/[^a-z0-9]/g, "");
  return alts.some(z => k(z) === k(v));
}

/* ---------- widgets ---------- */
const COL = {200:"#9aa1ad",100:"#5fb8c9",50:"#d98c4a",20:"#d9b230",10:"#e58a5a",5:"#a77bd1",2:"#5b8dd6"};
function itemEl(v){
  const b = document.createElement("button"); b.type="button"; b.className="mi-btn"; b.dataset.v = v;
  if (v >= 2) b.innerHTML = `<span class="bill" style="background:${COL[v]}">${v}<small>REAIS</small></span>`;
  else { const c = Math.round(v*100); b.innerHTML = `<span class="coinb ${c===10||c===5?"sv":""}">${v===1?"R$ 1":c+"¢"}</span>`; }
  b.setAttribute("aria-label", v>=1 ? `${v} reais` : `${Math.round(v*100)} centavos`);
  return b;
}
function initMoney(el, saved){
  const items = el.dataset.items.split(",").map(Number);
  el.innerHTML = `<div class="mpal"></div><div class="tray" aria-label="Bandeja de pagamento"></div><div class="mtotal">Total na bandeja: R$ <b>0,00</b></div>`;
  const pal = $(".mpal", el), tray = $(".tray", el), tot = $(".mtotal b", el);
  const upd = () => { const s = $$("button", tray).reduce((a,b)=>a+ +b.dataset.v, 0); tot.textContent = s.toFixed(2).replace(".", ","); el.classList.remove("ok","no"); };
  const add = v => { const b = itemEl(v); b.onclick = () => { b.remove(); upd(); persist(el); }; tray.append(b); upd(); };
  items.forEach(v => { const b = itemEl(v); b.onclick = () => { add(v); persist(el); }; pal.append(b); });
  (saved||[]).forEach(add);
  el._val = () => $$("button", tray).map(b => +b.dataset.v);
  el._check = () => Math.round(el._val().reduce((a,b)=>a+b,0)*100) === Math.round(+el.dataset.target*100);
}
function initSym(el, saved){
  const cols=+el.dataset.cols, rows=+el.dataset.rows, ax=+el.dataset.axis;
  const left = new Set(el.dataset.cells.split(";"));
  el.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    const b=document.createElement("button"); b.type="button"; b.dataset.k=`${r},${c}`;
    if (c<ax){ b.className = left.has(b.dataset.k) ? "on fix" : "fix"; b.tabIndex=-1; b.setAttribute("aria-hidden","true"); }
    else { b.setAttribute("aria-label",`linha ${r+1}, coluna ${c+1}`); b.onclick=()=>{ b.classList.toggle("on"); el.classList.remove("ok","no"); persist(el); }; if ((saved||[]).includes(b.dataset.k)) b.classList.add("on"); }
    el.append(b);
  }
  const axis=document.createElement("span"); axis.className="axis"; el.append(axis);
  requestAnimationFrame(()=>{ const b=el.children[ax]; if (b) axis.style.left = (b.offsetLeft-2.5)+"px"; });
  el._val = () => $$("button.on:not(.fix)", el).map(b=>b.dataset.k);
  el._check = () => {
    const want = new Set([...left].map(k=>{const [r,c]=k.split(",").map(Number); return `${r},${2*ax-1-c}`;}));
    const got = new Set(el._val()); return got.size===want.size && [...want].every(k=>got.has(k));
  };
}

/* ---------- render ---------- */
let curQid = null;
function fields(q){ return $$("[data-t]", q); }
function persist(el){
  const q = el.closest(".q"); const id = q.dataset.id;
  st.ans[id] = fields(q).map(f => f._val ? f._val() : (f.matches(".choice") ? f.dataset.sel ?? "" : f.value));
  if (st.ok[id]) { delete st.ok[id]; q.classList.remove("ok"); $(".fb", q).textContent=""; renderScore(); }
  save();
}
function gradeCount(g){ let n=0; for (const k in st.ok) if (k.startsWith(g+"-")) n++; return n; }
function renderScore(){
  $("#score").textContent = `${Object.keys(st.ok).length} / 150`;
  [3,4,5].forEach(g => $(`#tab${g} small`).textContent = `${gradeCount(g)} de 50 certas`);
  renderTrail();
}
function renderTrail(){
  if (st.view === "res") return;
  const g = st.pos.g, fichas = DATA.grades[g], tr = $("#trail"); tr.innerHTML = "";
  fichas.forEach((f,i) => {
    const okn = f.qs.filter(q => st.ok[`${g}-${q.n}`]).length;
    const b = document.createElement("button"); b.type="button";
    b.className = "tchip" + (i===st.pos.f[g]?" cur":"") + (okn===5?" done":"");
    b.innerHTML = `<b>${i+1}</b><span><em>${f.title}</em><i>${okn} de 5</i></span>`;
    b.onclick = () => { st.pos.f[g]=i; save(); render(); $("#sheet").scrollIntoView({behavior:"smooth",block:"start"}); };
    tr.append(b);
  });
}
function render(){
  const g = st.pos.g; document.body.className = "g"+g;
  const isRes = st.view === "res";
  $$(".tab").forEach(t => t.setAttribute("aria-selected", isRes ? t.dataset.g==="res" : t.dataset.g==g));
  $("#trail").hidden = isRes; $("#sheet").hidden = isRes; $("#results").hidden = !isRes;
  if (isRes) { renderScore(); renderResults(); return; }
  const i = st.pos.f[g], f = DATA.grades[g][i], fichas = DATA.grades[g];
  const sh = $("#sheet");
  sh.innerHTML = `
    <div class="shead"><div class="tt"><small>${g}º ano · ficha ${i+1} de 10</small><h2>${f.title}</h2><p>${f.sub}</p></div>
      <div class="tipbox"><div class="bubble" id="bubble">${f.tip}</div>${DATA.mascots[f.mascot]}</div></div>
    <div class="qs">${f.qs.map(q => `
      <section class="q" data-id="${g}-${q.n}" aria-label="Questão ${q.n}">
        <div class="num">${q.n}</div><div class="qb">${q.html}</div>
        <div class="qfoot"><button type="button" class="btn chk">Conferir</button><span class="fb" aria-live="polite"></span></div>
      </section>`).join("")}</div>
    <div class="sfoot"><span class="bncc">BNCC: ${f.bncc}</span>
      <div class="nav">${i>0?`<button type="button" class="btn ghost" id="prev">← Ficha anterior</button>`:""}
      <button type="button" class="btn ghost" id="all">Conferir a ficha toda</button>
      ${i<9?`<button type="button" class="btn" id="next">Próxima ficha →</button>`:""}</div></div>`;
  $$(".q", sh).forEach((q, qi) => {
    const id = q.dataset.id, saved = st.ans[id] || [];
    fields(q).forEach((el, k) => {
      el.id = `f-${id}-${k}`;
      const t = el.dataset.t, sv = saved[k];
      if (t==="m") initMoney(el, sv);
      else if (t==="sym") initSym(el, sv);
      else if (t==="ch"){
        $$(".opt", el).forEach(o => { o.setAttribute("aria-pressed", "false"); o.onclick = () => { $$(".opt", el).forEach(x=>x.setAttribute("aria-pressed","false")); o.setAttribute("aria-pressed","true"); el.dataset.sel=o.dataset.v; el.classList.remove("ok","no"); persist(el); }; });
        if (sv!==undefined && sv!==""){ el.dataset.sel=sv; const o=$(`.opt[data-v="${sv}"]`, el); if(o) o.setAttribute("aria-pressed","true"); }
      } else {
        if (sv!==undefined) el.value = sv;
        el.addEventListener("input", () => { el.classList.remove("ok","no"); persist(el); });
        if (el.tagName==="INPUT") el.addEventListener("keydown", e => { if (e.key==="Enter") check(q); });
      }
    });
    $(".chk", q).onclick = () => check(q);
    if (st.ok[id]) { q.classList.add("ok"); fields(q).forEach(el => el.classList.add("ok")); $(".fb", q).className="fb ok"; $(".fb", q).textContent = "Certinho!"; }
  });
  const nx = $("#next"), pv = $("#prev");
  if (nx) nx.onclick = () => { st.pos.f[g]=i+1; save(); render(); sh.scrollIntoView({behavior:"smooth",block:"start"}); };
  if (pv) pv.onclick = () => { st.pos.f[g]=i-1; save(); render(); sh.scrollIntoView({behavior:"smooth",block:"start"}); };
  $("#all").onclick = () => $$(".q", sh).forEach(q => check(q, true));
  renderScore(); partyCheck(false);
}
const PRAISE = ["Muito bem!", "Certinho!", "Mandou bem!", "Isso mesmo!", "Excelente!"];
function check(q, quiet){
  const id = q.dataset.id; let all = true, empty = true;
  fields(q).forEach(el => {
    let ok, t = el.dataset.t;
    if (el._check){ ok = el._check(); empty = empty && el._val().length===0; }
    else if (t==="ch"){ ok = el.dataset.sel !== undefined && el.dataset.sel === el.dataset.a; empty = empty && el.dataset.sel===undefined; }
    else { const v = el.value.trim(); empty = empty && !v; ok = v !== "" && (t==="s" ? v===el.dataset.a : same(v, el.dataset.a, t)); }
    el.classList.toggle("ok", ok); el.classList.toggle("no", !ok); all = all && ok;
  });
  const fb = $(".fb", q);
  if (all){
    st.ok[id] = true; q.classList.add("ok"); fb.className = "fb ok"; fb.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    q.classList.remove("pop"); void q.offsetWidth; q.classList.add("pop"); $(".gab", q)?.remove();
  } else {
    if (empty && quiet) { fields(q).forEach(el=>el.classList.remove("no")); return; }
    delete st.ok[id]; q.classList.remove("ok");
    st.tries[id] = (st.tries[id]||0) + 1; fb.className = "fb no";
    fb.textContent = empty ? "Responda antes de conferir." : "Quase! Corrija os campos em vermelho e tente de novo.";
    if (st.tries[id] >= 2 && !$(".showgab", q) && !empty){
      const b = document.createElement("button"); b.type="button"; b.className="btn ghost small showgab"; b.textContent="Ver a resposta";
      b.onclick = () => { b.remove(); st.peek[id] = true; save(); const s=document.createElement("span"); s.className="gab"; s.textContent="Resposta: " + DATA.grades[id.split("-")[0]].flatMap(f=>f.qs).find(x=>x.n==id.split("-")[1]).gab; $(".qfoot", q).append(s); };
      $(".qfoot", q).append(b);
    }
  }
  save(); renderScore(); partyCheck(true);
}
function partyCheck(fresh){
  const g = st.pos.g, f = DATA.grades[g][st.pos.f[g]], bub = $("#bubble");
  const done = f.qs.every(q => st.ok[`${g}-${q.n}`]);
  if (done){ bub.classList.add("party"); bub.innerHTML = `<b>Ficha completa!</b> Você acertou as 5 questões. ${st.pos.f[g]<9?"Vamos para a próxima?":"Você terminou o "+g+"º ano!"}`; if (fresh){ bub.classList.remove("pop"); void bub.offsetWidth; bub.classList.add("pop"); } }
  else { bub.classList.remove("party"); bub.innerHTML = f.tip; }
}

$$(".tab").forEach(t => t.onclick = () => {
  if (t.dataset.g === "res") st.view = "res"; else { st.view = "fichas"; st.pos.g = +t.dataset.g; }

});

/* ---------- resultados ---------- */
const META = {};
function meta(g, q){
  const id = `${g}-${q.n}`; if (META[id]) return META[id];
  const tp = document.createElement("template"); tp.innerHTML = q.html;
  const fs = $$("[data-t]", tp.content).map(el => ({t: el.dataset.t, opts: $$(".opt", el).map(o => plain(o))}));
  const c = tp.content.cloneNode(true);
  $$("svg,table,.choice,.sel,.in,.money,.sym,.arm,.chave,.grid,.ql,.row,.seq,.note,.ex,.big,div", c).forEach(n => n.remove());
  let txt = plain(c).replace(/\s+/g, " ").replace(/\s*(Resposta|R):\s*$/, "").trim();
  if (txt.length > 140) txt = txt.slice(0, 137).replace(/\s\S*$/, "") + "…";
  return META[id] = {fs, txt};
}
function plain(node){
  const c = node.cloneNode(true);
  $$(".fr", c).forEach(f => { const s = f.children; f.replaceWith(`${s[0]?.textContent ?? ""}/${s[1]?.textContent ?? ""}`); });
  return c.textContent;
}
const brl = v => "R$ " + v.toFixed(2).replace(".", ",");
function shown(m, vals){
  const out = m.fs.map((f, k) => {
    const v = vals[k];
    if (v === undefined || v === "" || (Array.isArray(v) && !v.length)) return null;
    if (f.t === "ch") return f.opts[+v] ?? v;
    if (f.t === "m") return `${brl(v.reduce((a,b)=>a+b,0))} (${v.map(x => x>=1 ? x : Math.round(x*100)+"¢").join(" + ")})`;
    if (f.t === "sym") return `${v.length} quadradinho${v.length>1?"s":""} pintado${v.length>1?"s":""}`;
    return String(v).trim() || null;
  });
  return out.some(x => x !== null) ? out.map(x => x ?? "□").join(" · ") : "";
}
function status(id){
  const has = (st.ans[id] || []).some(v => Array.isArray(v) ? v.length : v !== undefined && String(v).trim() !== "");
  if (st.ok[id]) return "ok";
  if (has && st.tries[id]) return "no";
  if (has) return "nc";
  return "em";
}
const LBL = {ok:"Certa", no:"Errada", nc:"Não conferida", em:"Em branco"};
function tryNote(id, s){
  const n = st.tries[id] || 0, p = st.peek[id] ? " · viu a resposta" : "";
  if (s === "ok") return (n === 0 ? "de primeira" : `na ${n+1}ª tentativa`) + p;
  if (s === "no") return `${n} tentativa${n>1?"s":""}` + p;
  return "";
}
function gradeStats(g){
  const c = {ok:0,no:0,nc:0,em:0,first:0,fichas:0};
  DATA.grades[g].forEach(f => { let all = true; f.qs.forEach(q => { const id=`${g}-${q.n}`, s=status(id); c[s]++; if (s==="ok" && !st.tries[id] && !st.peek[id]) c.first++; if (s!=="ok") all=false; }); if (all) c.fichas++; });
  return c;
}
function renderResults(){
  const g = st.pos.g, box = $("#results"), c = gradeStats(g), pct = Math.round(c.ok/50*100);
  const flt = st.rfilter;
  box.innerHTML = `
    <div class="rhead">
      <div class="rtop"><div><small>Conferência · ${g}º ano</small><h2>Resultados</h2>
        <p>Veja o que a criança respondeu em cada questão, a resposta certa e quantas tentativas ela precisou.</p></div>
        <div class="seg" role="group" aria-label="Escolher ano">${[3,4,5].map(x=>`<button type="button" data-g="${x}" aria-pressed="${x===g}">${x}º ano</button>`).join("")}</div></div>
      <div class="kpis">
        <div class="kpi k-main"><b>${c.ok} de 50</b><span>questões certas (${pct}%)</span></div>
        <div class="kpi k-ok"><b>${c.first}</b><span>certas de primeira</span></div>
        <div class="kpi k-no"><b>${c.no}</b><span>erradas, a revisar</span></div>
        <div class="kpi k-nc"><b>${c.nc}</b><span>respondidas sem conferir</span></div>
        <div class="kpi"><b>${c.em}</b><span>em branco</span></div>
      </div>
      <div class="meter" role="img" aria-label="${c.ok} certas, ${c.no} erradas, ${c.nc} sem conferir, ${c.em} em branco">
        <i class="st-ok" style="width:${c.ok*2}%;background:var(--dot)"></i><i class="st-no" style="width:${c.no*2}%;background:var(--dot)"></i><i class="st-nc" style="width:${c.nc*2}%;background:var(--dot)"></i></div>
      <div class="legend"><span class="st-ok">Certa</span><span class="st-no">Errada</span><span class="st-nc">Não conferida</span><span class="st-em">Em branco</span><span style="--dot:transparent">Fichas completas: ${c.fichas} de 10</span></div>
      <div class="rtools">
        <div class="seg" role="group" aria-label="Filtro">
          <button type="button" data-f="all" aria-pressed="${flt==="all"}">Todas as questões</button>
          <button type="button" data-f="todo" aria-pressed="${flt==="todo"}">Só o que falta acertar</button></div>
        <button type="button" class="btn ghost small" id="copy">Copiar resumo</button><span class="copied" id="copied" aria-live="polite"></span>
      </div>
      <div id="copyfb"></div>
    </div>
    ${DATA.grades[g].map((f,i) => {
      const rows = f.qs.map(q => { const id=`${g}-${q.n}`; return {q, id, s: status(id), m: meta(g,q)}; });
      const vis = flt==="todo" ? rows.filter(r => r.s!=="ok") : rows;
      const okn = rows.filter(r=>r.s==="ok").length;
      if (!vis.length) return "";
      return `<article class="rcard"><header><b class="n">${i+1}</b><h3>${f.title}</h3>
        <span class="dots" aria-hidden="true">${rows.map(r=>`<i class="st-${r.s}"></i>`).join("")}</span><span class="cnt">${okn} de 5</span></header>
        <div class="rtw"><table class="rt"><thead><tr><th>Nº</th><th>Questão</th><th>Resposta da criança</th><th>Resposta certa</th><th>Situação</th><th></th></tr></thead><tbody>
        ${vis.map(r => { const a = shown(r.m, st.ans[r.id]||[]); return `<tr>
          <td class="qn">${r.q.n}</td><td class="qt">${esc(r.m.txt)}</td>
          <td class="ans ${a?"":"empty"}">${a?esc(a):"—"}</td><td class="right">${esc(r.q.gab)}</td>
          <td><span class="pill st-${r.s}">${LBL[r.s]}</span><span class="tries">${tryNote(r.id, r.s)}</span></td>
          <td><button type="button" class="go" data-f="${i}">Abrir ficha</button></td></tr>`; }).join("")}
        </tbody></table></div></article>`;
    }).join("") || `<div class="rhead"><p style="margin:0;font-weight:700">Todas as 50 questões do ${g}º ano estão certas. Parabéns!</p></div>`}`;
  $$(".rtop .seg button", box).forEach(b => b.onclick = () => { st.pos.g = +b.dataset.g; save(); render(); });
  $$(".rtools .seg button", box).forEach(b => b.onclick = () => { st.rfilter = b.dataset.f; save(); renderResults(); });
  $$(".go", box).forEach(b => b.onclick = () => { st.view = "fichas"; st.pos.f[g] = +b.dataset.f; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); });
  $("#copy").onclick = () => copySummary(g);
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function copySummary(g){
  const c = gradeStats(g);
  let txt = `Caderno de Matemática · ${g}º ano\nCertas: ${c.ok} de 50 (${c.first} de primeira) · Erradas: ${c.no} · Sem conferir: ${c.nc} · Em branco: ${c.em}\n`;
  DATA.grades[g].forEach((f,i) => {
    const rows = f.qs.map(q => ({q, id:`${g}-${q.n}`}));
    txt += `\nFicha ${i+1} · ${f.title} (${rows.filter(r=>st.ok[r.id]).length} de 5)\n`;
    rows.forEach(r => { const s = status(r.id), a = shown(meta(g,r.q), st.ans[r.id]||[]);
      txt += `  ${r.q.n}. ${LBL[s]}${s!=="ok" ? ` · respondeu: ${a||"—"} · certa: ${r.q.gab}` : ""}\n`; });
  });
  const ok = () => { $("#copied").textContent = "Resumo copiado."; $("#copyfb").innerHTML = ""; };
  const fail = () => { $("#copied").textContent = "Selecione o texto abaixo e copie."; $("#copyfb").innerHTML = `<textarea class="copybox" id="copytxt" readonly></textarea>`; const ta=$("#copytxt"); ta.value = txt; ta.focus(); ta.select(); };
  try { navigator.clipboard.writeText(txt).then(ok, fail); } catch(e) { fail(); }
}
function answered(g){ let n=0; for (const k in st.ans) if (!g || k.startsWith(g+"-")) n++; return n; }
const qtd = (n, s, p) => `${n} ${n===1?s:p}`;
function openZerar(){
  const g = st.pos.g;
  $("#zopts").innerHTML = `
    <button type="button" class="zopt" data-z="${g}"><b>Só o ${g}º ano</b><span>${qtd(answered(g),"questão respondida","questões respondidas")} · ${qtd(gradeCount(g),"certa","certas")}</span></button>
    <button type="button" class="zopt all" data-z="all"><b>Tudo (3º, 4º e 5º ano)</b><span>${qtd(answered(),"questão respondida","questões respondidas")} · ${qtd(Object.keys(st.ok).length,"certa","certas")}</span></button>`;
  $$(".zopt").forEach(b => b.onclick = () => zerar(b.dataset.z));
  $("#zov").hidden = false; $(".zopt").focus();
}
function closeZerar(){ $("#zov").hidden = true; $("#zerar").focus(); }
function zerar(z){
  for (const m of [st.ans, st.ok, st.tries, st.peek]) for (const k of Object.keys(m)) if (z === "all" || k.startsWith(z+"-")) delete m[k];
  if (z === "all") st.pos.f = {3:0,4:0,5:0}; else st.pos.f[z] = 0;
  save(); closeZerar(); render(); window.scrollTo({top:0});
  const d = document.createElement("div"); d.className = "zdone"; d.setAttribute("role","status");
  d.textContent = z === "all" ? "Todas as respostas foram apagadas." : `Respostas do ${z}º ano apagadas.`;
  document.body.append(d); setTimeout(() => d.remove(), 2800);
}
$("#zerar").onclick = openZerar; $("#reset").onclick = openZerar; $("#zcancel").onclick = closeZerar;
$("#zov").addEventListener("click", e => { if (e.target.id === "zov") closeZerar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#zov").hidden) closeZerar(); });
render();
</script>

</body></html>
