# O caderno é um único HTML. Na Netlify, o build só liga o login (scripts/build.mjs) e copia os arquivos para dist/.
[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
